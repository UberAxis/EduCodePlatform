version: '3.8'

services:
  db:
    image: postgres:15
    container_name: educodeplatform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: EduCodePlatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educodeplatform_backend
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=EduCodePlatform;Username=postgres;Password=123"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      - db

volumes:
  postgres_data:
